services:
  api:
    build: .
    container_name: project4-ai-agent-api

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      HF_HOME: "home/app/.cache/huggingface"

    volumes:
      - hf_cache:/home/app/.cache/huggingface

    restart: unless-stopped

volumes:
  hf_cache: