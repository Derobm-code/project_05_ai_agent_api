<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Agent</title>

    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #202938;
            background: #f5f7fb;
        }

        * {
            box-sizing:border-box;
        }

        body {
            margin: 0;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 24px;
        }

        header {
            margin-bottom: 28px;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
        }
        .subtitle {
            color: #596579;
            line-height: 1.6;
        }

        .panel {
            background: white;
            border: 1px solid #e0e5ed;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px #1b2a4408;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 1px solid #cbd3df;
            border-radius: 9px;
            font: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: 2px solid #7ba7ff;
            border-color: #4668dc;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        button {
            border: 0;
            border-radius: 8px;
            background: #245bd7;
            color: white;
            padding: 12px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .hint, .status {
            color: #596579;
            font-size: 0.9rem;
        }

        .status {
            margin-top: 14px;
            white-space: pre-wrap;
        }

        .answer { 
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.75;
        }

        details {
            margin-top: 24px;
            border-top: 1px solid #e0e5ed;
            padding-top: 18px;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
        }

        .trace-step {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            background: #f5f7fb;
        }

        .trace-step pre {
            white-space: pre-wrap;
            overflow-wrap: 0.85rem;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                margin: 16px auto;
                padding: 14px;
            }

            .panel {
                padding: 17px;
            }

            .actions {
                align-items: flex-start;
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <main class=""container:>
        <header>
            <h1>Local AI Agent</h1>
            <p class="subtitle">
                Ask a question, perform calculations, or retrieve
                information from your local knowledge base.
            </p>
        </header>

        <section class="panel">
            <form id="chat-form">
                <label for="message">What would you like the agent to do?</label>
            
                <textarea
                    id="message"
                    name="message"
                    maxlength="2000"
                    placeholder="Example: Calculate 25% of 840 and then add 100."
                    required
                ></textarea>

                <div class="actions">
                    <span class="hint">Maximum 2,000 characters</span>
                    <button id="submit-button" type="submit">
                        Ask agent
                    </button>
                </div>
            </form>

            <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section id="result-panel class=panel" hidden>
            <h2>Agent response</h2>

            <div id="answer" class="answer"></div>

            <details id="trace-details">
                <summary>View tool excution trace</summary>
                <div id="trace"></div>
            </details>
        </section>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const messageInput = document.getElementById("message");
    </script>
</body>
</html>
